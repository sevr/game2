<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Chronicles of Rauna</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --bg-color: #050505;
            --text-color: #d2b48c; 
            --accent-color: #8b0000;
            --font-main: 'Crimson Text', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            height: 100dvh; 
            width: 100%;
            max-width: 500px; 
            margin: 0 auto;
            transition: opacity 0.8s ease-in-out;
            background-color: #000;
        }

        #image-viewer {
            flex: 1.1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
        }

        #game-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #ui-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-bottom: env(safe-area-inset-bottom, 20px);
            background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
            border-top: 2px solid var(--accent-color);
        }

        #question-text {
            color: var(--text-color);
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 15px;
            min-height: 6em;
            display: block;
            line-height: 1.4;
            overflow-y: auto;
        }

        .white { color: #ffffff; }
        .violet { color: #ee82ee; }
        .blue { color: #3498db; }
        .red { color: #ff4d4d; }
        .green { color: #2ecc71; }
        .pink { color: #ff69b4; }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr;
            grid-gap: 12px;
            flex: 1;
        }

        .game-btn {
            background-color: #111;
            border: 1px solid #444;
            color: var(--text-color);
            font-family: var(--font-main);
            border-radius: 2px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            text-align: left;
            transition: all 0.2s;
        }

        .btn-label {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.4rem;
            margin-right: 15px;
            min-width: 30px;
        }

        .btn-text { font-size: 1.1rem; }

        .effect-sparkle { animation: sparkle 0.6s ease-in-out; }
        .effect-shake { animation: shake 0.3s ease-in-out; border-color: #f00 !important; }

        @keyframes sparkle {
            0% { background-color: #111; }
            50% { background-color: #333; box-shadow: 0 0 15px var(--accent-color); }
            100% { background-color: #111; }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        #victory-screen {
            display: none;
            color: var(--text-color);
            font-size: 2rem;
            text-align: center;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
    </style>
</head>
<body>

<audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

<div class="game-container" id="stage">
    <div id="image-viewer">
        <img id="game-img" src="0.png">
        <div id="victory-screen">You beat the game. Nice work!</div>
    </div>

    <div id="ui-panel">
        <div id="question-text"></div>
        <div class="button-grid" id="btn-grid">
            <button class="game-btn" id="btnA" onclick="handleInput('A')">
                <span class="btn-label">A</span>
                <span class="btn-text" id="textA"></span>
            </button>
            <button class="game-btn" id="btnB" onclick="handleInput('B')">
                <span class="btn-label">B</span>
                <span class="btn-text" id="textB"></span>
            </button>
        </div>
    </div>
</div>

<script>
    let currentState = "START";
    let musicStarted = false;

    const gameData = {
        "START": {
            img: "0.png",
            text: "Awaken by the sound of gentle hoof like footsteps, deer leading their young away from the soft river soil, back home.<br><span class='white'>It would be nice to be home</span> you think to yourself.<br><span class='white'>Yet, Rauna needs my aide...</span><br>What do you do?",
            buttons: {
                A: { label: "Venture up river in search of Rauna.", next: "A1" },
                B: { label: "Go towards the rising sun, hoping to find a home still in Tisvalle.", next: "B1" }
            }
        },
        "A1": {
            img: "a1.png",
            text: "The kingdom of Faltin is ahead.<br><span class='white'>Rauna may be there, if the rumor is true.</span><br>What do you do?",
            buttons: {
                A: { label: "Capture a monkey and ride a deer into the dark forest.", next: "C1" },
                B: { label: "Continue north in search of the one who needs you.", next: "A2" }
            }
        },
        "A2": {
            img: "a2.png",
            text: "This town just outside Faltin has many special memories for you. You walk down the dusty path enjoying the sounds and aromas. <span class='white'>The bakers bread always smells like heaven.</span> What do you do?",
            buttons: {
                A: { label: "You enter the bakery for some fresh loafs.", next: "D1" },
                B: { label: "Rauna needs me more than ever, I must press onward.", next: "A3" }
            }
        },
        "D1": {
            img: "d1.png",
            text: "<span class='blue'>Young hero, has been many moons since your face came to these parts!</span><br><span class='white'>Indeed sir. Many many days indeed. Say, do you still bake that visan sweet bread?</span><br><span class='blue'>Oh my yeast, that's a request. Umm, this small loaf has been sitting here since last week. Consume at your own risk, haha.</span><br>What do you do?",
            buttons: {
                A: { label: "Quickly drop a copper coin, grab the loaf and scarf it down.", next: "D2" },
                B: { label: "Ignore the stale bread and continue outside.", next: "A2" }
            }
        },
        "D2": {
            img: "d2.png",
            text: "The yeast and sugars, after sitting a week in the sun, had formed a rare molecular compund called Death Yeast. You enjoyed the memories for 1.4 minutes, then you lay dead.",
            isDeath: true,
            buttons: { A: { label: "Try Again", next: "START" }, B: { label: "-", next: null } }
        },
        "A3": {
            img: "a3.png",
            text: "<span class='violet'>Halt peasant! How dare you bring dirt onto the stones of Faltin!</span><br><span class='white'>I mean no harm, I only...</span><br><span class='violet'>You'll be feeling the harm of this here javelin if you don't retreat.</span><br>What do you do?",
            buttons: {
                A: { label: "Hide, toss a rock to distract the guards, then climb up the ivy.", next: "A4" },
                B: { label: "Run to the right, kick off the wall and break through the gates.", next: "F1" }
            }
        },
        "F1": {
            img: "f1.png",
            text: "<span class='violet'>Typical heroic fool! You surmize us as simple foe on your epic quest, ha! Ha! HA! Turns out we're your final boss.</span><br>You sit, dead.",
            isDeath: true,
            buttons: { A: { label: "Try Again", next: "START" }, B: { label: "-", next: null } }
        },
        "A4": {
            img: "a4.png",
            text: "Always convenient to have ivy outside a window. Looking around the vacant quarters, you consider what to add to your satchel before finding Rauna.<br>What do you grab?",
            buttons: {
                A: { label: "You take the rope.", next: "A5" },
                B: { label: "You take the coins.", next: "A5" }
            }
        },
        "A5": {
            img: "a5.png",
            text: "The sinister King of Faltin is in the midst of their annual summer feast of Mova. <span class='white'>Excellent. After he adds a few more pounds to his ugly gut I'll jump down and make him surrender Rauna.</span><br>What do you do?",
            buttons: {
                A: { label: "I can't wait any longer, the gluttony is unending!", next: "G1", textClass: "white" },
                B: { label: "Wait until the first stars appear and yell with a roar.", next: "A6" }
            }
        },
        "G1": {
            img: "g1.png",
            text: "The land may yet have peace thanks to your swift dagger toss... Unfortunately, you will never see those days, because, arrows struck you mortally dead.",
            isDeath: true,
            buttons: { A: { label: "Try Again", next: "START" }, B: { label: "-", next: null } }
        },
        "A6": {
            img: "a6.png",
            text: "<span class='red'>I hate swine, except on my plate. And you really hurt my feeling by bringing attention to my ugly fat rolls... I'm going to chop you.</span><br><span class='white'>Your emotions bleed eh? Yes, that was the point. And now more feelings will be in pain after I swing this blade!</span>",
            buttons: {
                A: { label: "Swing your blade and end his reign.", next: "A7" },
                B: { label: "Fear grips your soul. You sprint away.", next: "A7" }
            }
        },
        "A7": {
            img: "a7.png",
            text: "You are standing in the hallway. Still terrified about what just occurred in the prior room. Frantically you open a door and hide inside.<br>Which door?",
            buttons: {
                A: { label: "The blue door.", next: "E1" },
                B: { label: "The brown door.", next: "A8" }
            }
        },
        "E1": {
            img: "e1.png",
            text: "<span class='green'>The potion is nearly complete. Yes yes... hazel of witch will resolve the last hiccup. Lad, drink up, this is what you need to defeat evil.</span><br>What do you do?",
            buttons: {
                A: { label: "Drink.", next: "E2" },
                B: { label: "Walk away.", next: "A7" }
            }
        },
        "E2": {
            img: "e2.png",
            text: "You are not dead. You are... a toad.",
            isDeath: true,
            buttons: { A: { label: "Restart", next: "START" }, B: { label: "-", next: null } }
        },
        "A8": {
            img: "a8.png",
            text: "You see Rauna standing at the window. You wonder how much distress she has endured these past months being locked away. Perhaps a gift will cheer her.<br>What do you give?",
            buttons: { 
                A: { label: "You toss the coins you found.", next: "H1" }, 
                B: { label: "You throw the rope you found.", next: "A9" } 
            }
        },
        "H1": {
            img: "h1.png",
            text: "She is greatly offended it seems.",
            buttons: { A: { label: "Try again?", next: "A8" }, B: { label: "-", next: null } }
        },
        "A9": {
            img: "a9.png",
            text: "You massively miscalculate your throw and bonk her head with the rope, there she goes tumbling out the window.<br><span class='pink'>Ouch!</span><br>You dive after her.",
            isEnd: true,
            buttons: { A: { label: "-", next: null }, B: { label: "-", next: null } }
        },
        "B1": {
            img: "b1.png",
            text: "Is your distant homeland on fire?<br>What do you do?",
            buttons: {
                A: { label: "Ignore the inevitable, and help Rauna instead.", next: "A1" },
                B: { label: "Run to Tisvalle.", next: "B3" }
            }
        },
        "B3": {
            img: "b3.png",
            text: "<span class='white'>Tisvalle may yet be saved!</span><br>What do you do?",
            buttons: {
                A: { label: "Put the children into the cart.", next: "B4" },
                B: { label: "Rescue the town doctor.", next: "B5" }
            }
        },
        "B4": {
            img: "b4.png",
            text: "You saved the children!<br>May your name always be remembered.",
            stopMusic: true,
            buttons: { A: { label: "Restart", next: "START" }, B: { label: "-", next: null } }
        },
        "B5": {
            img: "b5.png",
            text: "The doctor tends to several villagers and the town of Tisvalle is forever in your debt.",
            stopMusic: true,
            buttons: { A: { label: "Restart", next: "START" }, B: { label: "-", next: null } }
        },
        "C1": {
            img: "c1.png",
            text: "You are confronted by King Gongo, ape of supreme power.<br>What do you do?",
            buttons: {
                A: { label: "Duel King Gongo.", next: "C2" },
                B: { label: "Flee!", next: "A1" }
            }
        },
        "C2": {
            img: "c2.png",
            text: "King Gongo has killed you.",
            isDeath: true,
            buttons: { A: { label: "May your soul revive.", next: "START" }, B: { label: "-", next: null } }
        }
    };

    function updateUI() {
        const scene = gameData[currentState];
        const music = document.getElementById("bg-music");

        if (scene.stopMusic) {
            music.pause();
            music.currentTime = 0;
            musicStarted = false; 
        }

        document.getElementById("game-img").src = scene.img;
        document.getElementById("question-text").innerHTML = scene.text;
        document.getElementById("stage").style.opacity = "1";

        if (scene.isEnd) {
            document.getElementById("btn-grid").style.display = "none";
            setTimeout(() => {
                document.getElementById("game-img").style.display = "none";
                document.getElementById("question-text").style.display = "none";
                document.getElementById("victory-screen").style.display = "flex";
            }, 12000);
        } else {
            document.getElementById("btn-grid").style.display = "grid";
            document.getElementById("game-img").style.display = "block";
            document.getElementById("question-text").style.display = "block";
            document.getElementById("victory-screen").style.display = "none";
        }

        ['A', 'B'].forEach(key => {
            const btn = document.getElementById("btn" + key);
            const btnText = document.getElementById("text" + key);
            const data = scene.buttons[key];
            
            if (data && data.next !== null) {
                btnText.innerText = data.label;
                btnText.className = data.textClass === "white" ? "btn-text white" : "btn-text";
                btn.style.display = "flex";
            } else {
                btn.style.display = "none";
            }
        });
    }

    function handleInput(key) {
        const scene = gameData[currentState];
        if (!musicStarted && !scene.stopMusic) {
            document.getElementById("bg-music").play().catch(() => {});
            musicStarted = true;
        }

        const nextState = scene.buttons[key].next;
        const btn = document.getElementById("btn" + key);

        if (scene.isDeath || nextState === "START") {
            btn.classList.add("effect-shake");
        } else {
            btn.classList.add("effect-sparkle");
        }

        setTimeout(() => {
            document.getElementById("stage").style.opacity = "0";
            setTimeout(() => { 
                currentState = nextState; 
                updateUI(); 
            }, 1600);
        }, 1400);
    }

    window.onload = updateUI;
</script>
</body>
</html>
