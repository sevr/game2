<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Chronicles of Rauna</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --bg-color: #050505;
            --text-color: #e0d8c0; 
            --accent-color: #8b0000;
            --font-main: 'Crimson Text', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            height: 100dvh; 
            width: 100%;
            max-width: 500px; 
            margin: 0 auto;
            transition: opacity 0.8s ease-in-out;
            background-color: #000;
        }

        #image-viewer {
            flex: 1.1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
        }

        #game-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #ui-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-bottom: env(safe-area-inset-bottom, 20px);
            background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
            border-top: 2px solid var(--accent-color);
        }

        #question-text {
            color: var(--text-color);
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 15px;
            min-height: 6em;
            display: block;
            line-height: 1.4;
            overflow-y: auto;
        }

        /* Custom Colors for Dialogue */
        .violet { color: #ee82ee; }
        .white { color: #ffffff; }
        #question-text i { color: #b0a890; font-style: italic; }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr;
            grid-gap: 12px;
            flex: 1;
        }

        .game-btn {
            background-color: #111;
            border: 1px solid #444;
            color: var(--text-color);
            font-family: var(--font-main);
            border-radius: 2px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            text-align: left;
            transition: all 0.2s;
        }

        .btn-label {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.4rem;
            margin-right: 15px;
            min-width: 30px;
        }

        .btn-text { font-size: 1.1rem; }

        @keyframes sparkle {
            0% { background-color: #111; }
            50% { background-color: #333; box-shadow: 0 0 15px var(--accent-color); }
            100% { background-color: #111; }
        }

        .effect-sparkle { animation: sparkle 0.6s ease-in-out; }
    </style>
</head>
<body>

<audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

<div class="game-container" id="stage">
    <div id="image-viewer">
        <img id="game-img" src="0.png">
    </div>

    <div id="ui-panel">
        <div id="question-text"></div>
        <div class="button-grid">
            <button class="game-btn" id="btnA" onclick="handleInput('A')">
                <span class="btn-label">A</span>
                <span class="btn-text" id="textA"></span>
            </button>
            <button class="game-btn" id="btnB" onclick="handleInput('B')">
                <span class="btn-label">B</span>
                <span class="btn-text" id="textB"></span>
            </button>
        </div>
    </div>
</div>

<script>
    let currentState = "START";
    let musicStarted = false;

    const gameData = {
        "START": {
            img: "0.png",
            text: "You awake from the sound gentle hoof like footsteps, deer leading their young away from the soft river soil, back home.<br><i>It would be nice to be home</i> you think to yourself.<br><i>Yet, Rauna needs my aide...</i><br>What do you do?",
            buttons: {
                A: { label: "Venture up river in search of Rauna.", next: "A1" },
                B: { label: "Go towards the rising sun, hoping to find a home still in Tisvalle.", next: "B1" }
            }
        },
        "A1": {
            img: "a1.png",
            text: "The kingdom of Faltin is ahead.<br><i>Rauna may be there, if the rumor is true.</i><br>What do you do?",
            buttons: {
                A: { label: "Capture a monkey and ride a deer into the dark forest.", next: "C1" },
                B: { label: "Continue north in search of the one who needs you.", next: "A2" }
            }
        },
        "A2": {
            img: "a2.png",
            text: "This town just outside Faltin has many special memories for you. You walk down the dusty path enjoying the sounds and aromas. <i>The bakers bread always smells like heaven.</i> What do you do?",
            buttons: {
                A: { label: "You enter the bakery for some fresh loafs.", next: "D1" },
                B: { label: "Rauna needs me more than ever, I must press onward.", next: "A3" }
            }
        },
        "A3": {
            img: "a3.png",
            text: "<span class='violet'>Halt peasant! How dare you bring dirt onto the stones of Faltin!</span><br><span class='white'>I mean no harm, I only...</span><br><span class='violet'>You'll be feeling the harm of this here javelin if you don't retreat.</span><br>What do you do?",
            buttons: {
                A: { label: "Hide, toss a rock to distract the guards, then climb up the ivy.", next: "A4" },
                B: { label: "Run to the right, kick off the wall and break through the gates.", next: "F1" }
            }
        },
        "B1": {
            img: "b1.png",
            text: "Is your distant homeland on fire?<br>What do you do?",
            buttons: {
                A: { label: "Ignore the inevitable, and help Rauna instead.", next: "A1" },
                B: { label: "Run to Tisvalle.", next: "B3" }
            }
        },
        "B3": {
            img: "b3.png",
            text: "<i>Tisvalle may yet be saved!</i><br>What do you do?",
            buttons: {
                A: { label: "Put the children into the cart and send them to Kingdom of Faltin.", next: "B4" },
                B: { label: "Rescue the town doctor in hopes that he may mend others wounds.", next: "B5" }
            }
        },
        "B4": {
            img: "b4.png",
            text: "You saved the children!<br>May your name always be remembered.",
            stopMusic: true,
            buttons: { A: { label: "Restart", next: "START" }, B: { label: "-", next: null } }
        },
        "B5": {
            img: "b5.png",
            text: "The doctor tends to several villagers and the town of Tisvalle is forever in your debt and gratitude.",
            stopMusic: true,
            buttons: { A: { label: "Restart", next: "START" }, B: { label: "-", next: null } }
        },
        "C1": {
            img: "c1.png",
            text: "You are confronted by King Gongo, ape of supreme power.<br>What do you do?",
            buttons: {
                A: { label: "Duel King Gongo to take dominion over the entire forest.", next: "C2" },
                B: { label: "Flee!", next: "A1" }
            }
        },
        "C2": {
            img: "c2.png",
            text: "King Gongo has killed you.",
            buttons: { A: { label: "May your soul revive.", next: "START" }, B: { label: "-", next: null } }
        },
        "D1": { img: "d1.png", text: "The bread is delicious...", buttons: { A: { label: "Restart", next: "START" }, B: { label: "-", next: null } } },
        "A4": { img: "a4.png", text: "You scale the ivy...", buttons: { A: { label: "Restart", next: "START" }, B: { label: "-", next: null } } },
        "F1": { img: "f1.png", text: "You crash through the gates!", buttons: { A: { label: "Restart", next: "START" }, B: { label: "-", next: null } } }
    };

    function updateUI() {
        const scene = gameData[currentState];
        const music = document.getElementById("bg-music");

        // Logic to stop music on specific endings
        if (scene.stopMusic) {
            music.pause();
            music.currentTime = 0;
            musicStarted = false; 
        }

        document.getElementById("game-img").src = scene.img;
        document.getElementById("question-text").innerHTML = scene.text;
        document.getElementById("stage").style.opacity = "1";

        ['A', 'B'].forEach(key => {
            const btn = document.getElementById("btn" + key);
            const data = scene.buttons[key];
            btn.className = "game-btn";
            document.getElementById("text" + key).innerText = data.label;
            btn.style.display = data.next === null ? "none" : "flex";
        });
    }

    function handleInput(key) {
        if (!musicStarted && !gameData[currentState].stopMusic) {
            document.getElementById("bg-music").play().catch(() => {});
            musicStarted = true;
        }

        const nextState = gameData[currentState].buttons[key].next;
        const btn = document.getElementById("btn" + key);
        btn.classList.add("effect-sparkle");

        setTimeout(() => {
            document.getElementById("stage").style.opacity = "0";
            setTimeout(() => { currentState = nextState; updateUI(); }, 600);
        }, 400);
    }

    window.onload = updateUI;
</script>
</body>
</html>
